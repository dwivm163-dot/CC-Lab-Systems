<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An expectation and reality collage about art, design, and creative work." />
    <title>Making — Saved for Later</title>
    <link rel="stylesheet" href="styles.css?v=15" />
  </head>
  <body>
    <main class="collage-workspace collage-workspace-making">
      <header class="collage-header">
        <a class="collage-home-link" href="index.html">Saved for Later</a>
        <nav aria-label="Collage pages">
          <a href="appearance.html">Appearance</a>
          <a aria-current="page" href="making.html">Making</a>
          <a href="living.html">Living</a>
        </nav>
      </header>

      <div class="collage-title-row">
        <h1>Making</h1>
      </div>

      <section
        aria-label="Making expectation and reality collage workspace"
        class="collage-canvas making-collage"
        data-collage="making"
      >
        <figure class="making-piece piece-indian-max">
          <img class="piece-image" src="collages/making/indian-maximalism.jpg" alt="Indian maximalism moodboard with lotus, truck, and colour swatches" />
        </figure>
        <figure class="making-piece piece-rangrez">
          <img class="piece-image" src="collages/making/rangrez.jpg" alt="Rangrez collage of desi fashion, stamps, and gold objects" />
        </figure>
        <figure class="making-piece piece-lotus-eyes">
          <img class="piece-image piece-photo" src="collages/making/lotus-eyes.jpg" alt="Lotus flowers over red eyes with a matchbox drawing" />
        </figure>
        <figure class="making-piece piece-flora-fauna">
          <img class="piece-image" src="collages/making/flora-fauna.jpg" alt="Flora and fauna colour board with butterfly and botanicals" />
        </figure>
        <figure class="making-piece piece-seasonal">
          <img class="piece-image" src="collages/making/seasonal-patterns.jpg" alt="Seasonal floral pattern swatches" />
        </figure>
        <figure class="making-piece piece-flower-posters">
          <img class="piece-image" src="collages/making/flower-posters.jpg" alt="Grid of botanical poster designs" />
        </figure>
        <figure class="making-piece piece-theme-board">
          <img class="piece-image" src="collages/making/theme-board.jpg" alt="Dried iris theme board" />
        </figure>
        <figure class="making-piece piece-burgundy-desert">
          <img class="piece-image piece-photo" src="collages/making/burgundy-desert.jpg" alt="Burgundy and olive abstract leaf composition" />
        </figure>
        <figure class="making-piece piece-wavy">
          <img class="piece-image piece-photo" src="collages/making/wavy-portrait.jpg" alt="Abstract wavy graphic over a makeup portrait" />
        </figure>
        <figure class="making-piece piece-mirrored">
          <img class="piece-image piece-photo" src="collages/making/mirrored-face.jpg" alt="Mirrored editorial face with a bee earring" />
        </figure>
        <figure class="making-piece piece-burgundy-makeup">
          <img class="piece-image piece-photo" src="collages/making/burgundy-makeup.jpg" alt="Editorial portrait with burgundy makeup" />
        </figure>
        <figure class="making-piece piece-lilac-eyes">
          <img class="piece-image piece-photo" src="collages/making/lilac-eyes.jpg" alt="Close-up of lilac and blue eyeshadow" />
        </figure>

        <p class="collage-note making-note-desi">
          desi maximalism <span aria-hidden="true">→</span>
        </p>
        <p class="collage-note making-note-palettes">
          colour palettes <span aria-hidden="true">↙</span>
        </p>
        <p class="collage-note making-note-patterns">
          floral patterns <span aria-hidden="true">↗</span>
        </p>
        <p class="collage-note making-note-theme">
          theme board <span aria-hidden="true">→</span>
        </p>
        <p class="collage-note making-note-mcgrath">
          pat mcgrath <span aria-hidden="true">↘</span>
        </p>
        <p class="making-blank">
          I literally dont remember the last time I created something for fun.
        </p>
      </section>
    </main>
    <script src="collage.js?v=3"></script>
