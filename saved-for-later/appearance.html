<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An expectation and reality collage about fashion, accessories, makeup, hair, and nails."
    />
    <title>Appearance — Saved for Later</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="collage-workspace collage-workspace-appearance">
      <header class="collage-header">
        <a class="collage-home-link" href="/index.html">Saved for Later</a>
        <nav aria-label="Collage pages">
          <a aria-current="page" href="/appearance.html">Appearance</a>
          <a href="/making.html">Making</a>
          <a href="/living.html">Living</a>
        </nav>
      </header>

      <div class="collage-title-row">
        <h1>Appearance</h1>
      </div>

      <section
        aria-label="Appearance expectation and reality collage workspace"
        class="collage-canvas appearance-collage"
        data-collage="appearance"
      >
        <figure class="appearance-piece piece-vivienne-tights">
          <img class="piece-image piece-photo" src="/collages/appearance/vivienne-tights.jpg" alt="Vivienne Westwood tartan tights and red bag" />
        </figure>
        <figure class="appearance-piece piece-vivienne-outfit">
          <img class="piece-image" src="/collages/appearance/vivienne-outfit.png" alt="Vivienne Westwood tartan outfit and handbag" />
        </figure>
        <figure class="appearance-piece piece-plaid-corset">
          <img class="piece-image" src="/collages/appearance/plaid-corset.png" alt="Red tartan corset" />
        </figure>
        <figure class="appearance-piece piece-burgundy-blazer">
          <img class="piece-image" src="/collages/appearance/burgundy-blazer.png" alt="Burgundy fitted blazer" />
        </figure>
        <figure class="appearance-piece piece-vivienne-plaid">
          <img class="piece-image" src="/collages/appearance/vivienne-plaid.png" alt="Vivienne Westwood tartan graphic" />
        </figure>
        <figure class="appearance-piece piece-street">
          <img class="piece-image" src="/collages/appearance/street-style.png" alt="Street-style outfit collage" />
        </figure>
        <figure class="appearance-piece piece-green-look">
          <img class="piece-image" src="/collages/appearance/green-burgundy-look.png" alt="Burgundy and green layered outfit" />
        </figure>
        <figure class="appearance-piece piece-green-eye">
          <img class="piece-image" src="/collages/appearance/green-eye.png" alt="Green and pink eye makeup" />

          <img class="piece-image" src="/collages/appearance/mudra-lotus.jpg" alt="Hands and lotus illustration" />
        </figure>
        <figure class="appearance-piece piece-eyes">
          <img class="piece-image piece-photo" src="/collages/appearance/eyes.jpg" alt="Dramatic vintage eye makeup" />
        </figure>
        <figure class="appearance-piece piece-woman-back">
          <img class="piece-image" src="/collages/appearance/woman-back.png" alt="Woman in a black top seen from behind" />
        </figure>
        <figure class="appearance-piece piece-earrings">
          <img class="piece-image" src="/collages/appearance/earrings.jpg" alt="Gold jhumka earrings" />
        </figure>
        <figure class="appearance-piece piece-henna">
          <img class="piece-image piece-photo" src="/collages/appearance/henna.jpg" alt="Hands decorated with henna" />
        </figure>
        <figure class="appearance-piece piece-boots">
          <img class="piece-image" src="/collages/appearance/boots.png" alt="Black platform boots" />

        <figure class="appearance-piece piece-leopard-coat">
          <img class="piece-image" src="/collages/appearance/leopard-coat.png" alt="Leopard coat and burgundy bag" />
        </figure>
        <figure class="appearance-piece piece-brown-look">
          <img class="piece-image" src="/collages/appearance/brown-look.png" alt="Brown vintage outfit collage" />
        </figure>
        <figure class="appearance-piece piece-jewelry">
          <img class="piece-image piece-photo" src="/collages/appearance/jewelry.jpg" alt="Maximalist sunglasses and jewelry" />

        </figure>
        <figure class="appearance-piece piece-bags">
          <img class="piece-image piece-photo" src="/collages/appearance/bags.jpg" alt="Vintage monogram shoulder bags" />
        </figure>
        <figure class="appearance-piece piece-palette">
          <img class="piece-image" src="/collages/appearance/palette.png" alt="Burgundy and olive colour palette" />
        </figure>

        <p class="collage-note note-vintage">
          vintage bag<br />collection <span aria-hidden="true">↗</span>
        </p>
        <p class="collage-note note-leopard">
          leopard print +<br />red &gt;&gt;&gt; <span aria-hidden="true">↙</span>
        </p>
        <p class="collage-note note-desi">
          desi maximalism <span aria-hidden="true">→</span>
        </p>
        <p class="collage-note note-y2k">
          Y2K <span aria-hidden="true">↖</span>
        </p>
        <p class="collage-stat"><strong>42%</strong>accessories</p>
      </section>

</html>
