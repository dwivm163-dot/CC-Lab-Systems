<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Illusion of Escape | Sensory Atlas</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');
:root{--bg:#eaece8;--paper:#f8f8f3;--ink:#202a27;--mute:#67716c;--line:#d8ddd5;--a:#567e79}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #df9d65;outline-offset:2px}.app{max-width:1600px;margin:auto;min-height:100vh;display:grid;grid-template-columns:306px minmax(0,1fr) 275px;grid-template-rows:75px minmax(580px,1fr) 80px;gap:1px;background:#d4dad1}.top{grid-column:1/-1;background:var(--paper);padding:15px 27px;display:flex;justify-content:space-between;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:700;color:#64817b}.top h1{font:italic 30px 'Playfair Display',Georgia,serif;margin:0}.top .subtitle{color:#718078;font-size:12px}.panel{background:var(--paper);padding:27px 23px;overflow:auto}.panel h2{font:23px 'Playfair Display',Georgia,serif;font-weight:500;margin:5px 0 6px}.muted{font-size:12px;color:#6c7971;line-height:1.6}.rule{border:0;border-top:1px solid var(--line);margin:23px 0}.tiny{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:#78857d}.layers{display:flex;flex-direction:column;gap:9px;margin:17px 0}.layer{display:grid;grid-template-columns:35px 1fr 27px;gap:10px;padding:11px 9px;align-items:center;background:white;border:1px solid #dfe4de;border-radius:10px;box-shadow:0 2px 0 #e9ece7;cursor:grab;transition:transform .15s,border-color .15s}.layer:hover{border-color:#8ca9a0}.layer:active{cursor:grabbing}.layer.dragging{opacity:.48}.layer.inactive{opacity:.55}.swatch{width:35px;height:35px;display:grid;place-items:center;border-radius:8px;font-size:23px}.layer strong{font-size:12px}.layer small{display:block;font-size:10px;color:#88908b;margin-top:4px}.layer button{border:1px solid #dbe0db;background:#fff;border-radius:6px;width:27px;height:27px;color:#46685e}.layer button[aria-pressed=true]{background:#263b36;color:white;border-color:#263b36}.layer .handle{font-size:10px;color:#98a59a}.hint{background:#e9efea;border:1px dashed #b8c8bc;padding:13px;border-radius:8px;font-size:11px;line-height:1.5;color:#5f7669}.mapzone{min-width:0;padding:26px;background:#eff0eb;display:flex;flex-direction:column;gap:13px}.maphead{display:flex;align-items:center;justify-content:space-between}.maphead h2{font:23px 'Playfair Display',Georgia,serif;margin:0}.seg{display:flex;background:#e3e6e0;border-radius:25px;padding:3px;gap:2px}.seg button{border:0;border-radius:22px;background:transparent;padding:8px 13px;color:#67716b;font-size:11px}.seg button[aria-pressed=true]{background:#244b45;color:white}.mapframe{position:relative;background:#fff;border:1px solid #d3d9cf;padding:15px;box-shadow:0 15px 45px #6d75691a;flex:1;display:flex;align-items:flex-start;justify-content:center;min-height:340px;overflow:hidden}.mapcanvas{position:relative;width:100%;max-width:970px;aspect-ratio:1200/567;overflow:hidden;background:#faf9f4;border:1px solid #e2e5e0}.mapcanvas img{display:block;width:100%;height:100%;object-fit:contain;filter:grayscale(1) contrast(.77);opacity:.41}.mapcanvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.mapcanvas svg [data-layer]{transition:opacity .4s}.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:11px;color:#57685f}.dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:5px}.listen{color:#49615d;font-size:11px}.sidecard{background:#fff;border:1px solid #e0e4df;border-radius:10px;padding:15px;margin-top:14px}.sidecard h3{font:19px 'Playfair Display',Georgia,serif;margin:5px 0 8px}.sidecard p{font-size:12px;line-height:1.7;color:#5f6d64;margin:0}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #e9eee9;padding:10px 0;font-size:12px}.metric:last-child{border:0}.bigstatement{font:italic 21px 'Playfair Display',Georgia,serif;line-height:1.3;color:#446d69}.bottom{grid-column:1/-1;display:flex;gap:22px;align-items:center;justify-content:space-between;background:#f8f8f3;padding:12px 28px}.timeline{display:flex;align-items:center;gap:15px;flex:1}.timeline input{width:100%;accent-color:#48776d}.tag{padding:6px 10px;background:#e6ede7;border-radius:20px;font-size:11px}.bottom button{background:#234c43;color:white;border:0;border-radius:7px;padding:10px 15px}.playinstructions{display:none}.layer-description{margin:0;font-size:12px;color:#69766b}.order{font-size:11px;color:#84968a}.mapfoot{font-size:11px;color:#8a958b;display:flex;justify-content:space-between;gap:12px}.pulse{animation:breath 5s ease-in-out infinite;transform-origin:center}.drift{animation:drift 8s ease-in-out infinite alternate}.dash{animation:dash 16s linear infinite}@keyframes breath{50%{opacity:.48;transform:scale(1.045)}}@keyframes drift{to{transform:translate(18px,-6px)}}@keyframes dash{to{stroke-dashoffset:-160}}@media(max-width:1100px){.app{grid-template-columns:240px 1fr;grid-template-rows:75px auto auto 80px}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:15px}.right .tiny,.right h2{grid-column:1/-1}.right .rule{display:none}.mapzone{min-height:540px}.panel{padding:20px}.top h1{font-size:24px}}@media(max-width:670px){.app{display:block}.top{padding:18px;display:block}.panel{padding:18px}.mapzone{padding:14px;min-height:450px}.maphead{flex-wrap:wrap;gap:8px}.mapframe{padding:6px;min-height:240px}.right{display:block}.bottom{padding:15px;display:block}.bottom button{margin-top:12px;width:100%}.mapcanvas{min-width:350px}.mapframe{overflow-x:auto;justify-content:flex-start}}
</style></head><body><div id="root"></div><script>
const DATA={sound:{name:'Sound',symbol:'≈',sub:'Ripples / jagged edges',color:'#8fc8db',description:'Waterfall masking, traffic intrusion, ambient conversations.'},smell:{name:'Smell',symbol:'◌',sub:'Drifting translucent clouds',color:'#c5d9a7',description:'Vegetation, moisture, street exhaust and food, to verify on site.'},movement:{name:'Movement',symbol:'↗',sub:'Directional trajectories',color:'#e8ad8c',description:'Routes, stops and pauses between the entrance and seating.'},social:{name:'Social life',symbol:'●',sub:'Clusters and lone dots',color:'#e4b9be',description:'Individual rest, conversation, and gathering.'},hidden:{name:'Hidden systems',symbol:'⌗',sub:'Architectural / data traces',color:'#bcb6d6',description:'Water circulation, rules, maintenance and managed public access.'}};
const STATES=[{name:'Morning',short:'09:00',description:'Sparse visitors, mostly solitary seating toward the shaded western side. Light conversation, a few short routes, and dominant waterfall sound.'},{name:'Afternoon',short:'14:00',description:'Peak activity in this illustrative scenario: larger groups across central seating, multiple crisscrossing routes, stronger conversation and food scents.'},{name:'Evening',short:'18:00',description:'Fewer visitors, with small groups near the waterfall and some quick exit routes. Traffic becomes more noticeable at the entrance as social activity thins.'}];
const insights={sound:'The loudest feature may produce the strongest feeling of quiet. Water masks rather than removes the city.',smell:'Scent has no fixed boundary. Air movement and seasonal conditions can change the park’s sensory footprint.',movement:'A route is also a rhythm: entering, slowing, stopping, then returning to the street.',social:'Privacy and company coexist in close quarters. “Rest” can look different for every visitor.',hidden:'The apparent natural refuge depends on circulation, maintenance, design, and rules.'};
let active=['sound','smell','movement','social','hidden'],order=Object.keys(DATA),time=0,selected='sound';
const svgShapes={
sound:`<g opacity=".70"><ellipse cx="935" cy="305" rx="185" ry="170" fill="#4c9ec7" opacity=".13" class="pulse"/><ellipse cx="935" cy="305" rx="125" ry="125" fill="none" stroke="#3489b9" stroke-width="9" opacity=".5"/><ellipse cx="935" cy="305" rx="220" ry="212" fill="none" stroke="#51adcf" stroke-width="9" opacity=".4"/><ellipse cx="935" cy="305" rx="295" ry="280" fill="none" stroke="#51adcf" stroke-width="7" stroke-dasharray="14 17" opacity=".45"/><path d="M0 505 Q130 475 240 505 T490 505" stroke="#db7864" stroke-width="13" stroke-dasharray="20 14" fill="none" opacity=".75"/><path d="M0 425 Q105 395 225 420" stroke="#db7864" stroke-width="11" stroke-dasharray="20 17" fill="none" opacity=".56"/></g>`,
smell:`<g opacity=".66" class="drift"><ellipse cx="410" cy="234" rx="205" ry="88" fill="#95bd63" opacity=".25"/><ellipse cx="515" cy="350" rx="255" ry="90" fill="#9bbd73" opacity=".26"/><ellipse cx="810" cy="390" rx="155" ry="105" fill="#acd5c4" opacity=".32"/><ellipse cx="92" cy="482" rx="110" ry="47" fill="#b0aa8f" opacity=".33"/><path d="M260 230Q350 125 480 210M480 390Q590 280 675 350" stroke="#73935d" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 15" fill="none"/></g>`,
movement:`<g class="dash" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M10 260C110 268 172 330 310 336S540 360 722 320S880 280 920 250" stroke="#d87d55" stroke-width="10" stroke-dasharray="20 18" opacity=".85"/><path d="M16 355Q165 415 290 445T635 452" stroke="#d87d55" stroke-width="7" stroke-dasharray="14 21" opacity=".68"/><path d="M90 120C230 140 220 280 330 310S430 360 520 350" stroke="#efa980" stroke-width="5" stroke-dasharray="12 14" opacity=".66"/><path d="m905 238 16 15 12-20M635 440l12 10 -4-20" stroke="#d87d55" stroke-width="8"/></g>`,
social:`<g fill="#b8657b" stroke="#fff" stroke-width="3" opacity=".83"><circle cx="390" cy="205" r="13"/><circle cx="435" cy="208" r="14"/><circle cx="411" cy="240" r="13"/><circle cx="515" cy="405" r="15"/><circle cx="548" cy="421" r="14"/><circle cx="568" cy="392" r="13"/><circle cx="720" cy="190" r="14"/><circle cx="790" cy="375" r="13"/><circle cx="185" cy="447" r="11"/><circle cx="665" cy="476" r="12"/></g><g fill="none" stroke="#b8657b" stroke-width="3" opacity=".42"><ellipse cx="420" cy="221" rx="77" ry="55" class="pulse"/><ellipse cx="539" cy="407" rx="76" ry="47" class="pulse"/><circle cx="720" cy="190" r="32"/></g>`,
hidden:`<g opacity=".65" fill="none"><path d="M985 250V480H810V510H500" stroke="#7462a0" stroke-width="10" stroke-dasharray="11 9"/><path d="M985 480V545H1120" stroke="#7462a0" stroke-width="7" stroke-dasharray="8 12"/><path d="M140 65V520H1030" stroke="#7462a0" stroke-width="3" stroke-dasharray="10 10"/><rect x="120" y="52" width="900" height="475" rx="3" stroke="#7462a0" stroke-width="5" stroke-dasharray="12 15"/><circle cx="985" cy="480" r="25" fill="#7462a0" opacity=".15"/><circle cx="985" cy="480" r="19" stroke="#7462a0" stroke-width="5"/></g>`};

// Deliberately distinct illustrative scenarios for playtesting, not recorded visitor data.
const SCENARIOS=[
 {visitors:12, groups:2, routes:3, water:88, traffic:28, voices:16, scent:24, focus:'Western / shaded seating', dots:[[292,144],[345,173],[405,396],[475,427],[532,165],[610,356],[708,439],[790,300],[842,395],[270,412],[560,265],[650,184]], paths:[['M18 294 Q140 304 260 290 T490 318',7],['M20 355 Q112 382 230 403 T410 413',5],['M25 290 Q180 245 307 145',4]]},
 {visitors:46, groups:12, routes:11, water:94, traffic:48, voices:86, scent:78, focus:'Central seating and waterfall edge', dots:[[299,150],[322,173],[354,155],[380,175],[417,195],[447,217],[470,187],[505,221],[532,244],[558,269],[585,296],[609,316],[650,341],[675,370],[701,391],[727,410],[745,329],[785,350],[805,372],[828,390],[860,414],[306,380],[332,401],[355,421],[392,440],[412,465],[445,482],[484,392],[503,418],[532,449],[559,472],[598,445],[625,475],[664,450],[689,470],[724,478],[764,474],[803,467],[839,457],[864,300],[875,330],[897,356],[908,394],[900,429],[773,224],[812,240]],paths:[['M10 290Q145 285 240 312 T455 333 T720 300 T950 255',10],['M15 355Q165 425 303 440 T615 460',9],['M18 245Q185 185 360 190 T665 230',7],['M50 470Q190 410 355 330 T650 260',8],['M130 72Q280 132 420 295 T750 427',6],['M200 500Q340 432 485 396 T900 346',7],['M30 345Q240 345 420 390 T920 450',8],['M700 510Q760 415 855 318',7],['M80 215Q240 245 430 210 T820 180',6],['M175 80Q295 190 505 315 T855 340',5],['M340 505Q505 470 610 388 T925 285',6]]},
 {visitors:19, groups:5, routes:5, water:82, traffic:77, voices:34, scent:40, focus:'Waterfall edge and departure routes', dots:[[728,176],[753,193],[782,185],[805,213],[831,229],[857,250],[886,274],[748,373],[776,392],[803,413],[830,434],[847,459],[535,185],[562,207],[590,236],[403,417],[425,445],[295,400],[312,427]],paths:[['M930 285Q750 322 580 340 T310 332 T10 300',10],['M900 438Q660 462 450 444 T10 365',9],['M800 230Q615 212 470 300 T20 280',7],['M650 480Q430 450 260 408 T20 355',7],['M870 188Q720 260 500 295 T30 290',6]]}
];
function dotsMarkup(s){return `<g fill="#ad667e" stroke="#fff" stroke-width="4" opacity=".96">${s.dots.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${i%5===0?14:10}"/>`).join('')}</g>` + (time===1?'<g fill="none" stroke="#bf8290" stroke-width="4" opacity=".55"><ellipse cx="410" cy="202" rx="160" ry="75"/><ellipse cx="630" cy="411" rx="208" ry="90"/><ellipse cx="818" cy="361" rx="90" ry="145"/></g>':time===2?'<g fill="none" stroke="#bf8290" stroke-width="4" opacity=".6"><ellipse cx="810" cy="310" rx="120" ry="180"/></g>':'');}
function routesMarkup(s){return `<g fill="none" stroke="#dd7f55" stroke-linecap="round" class="dash">${s.paths.map(([d,w],i)=>`<path d="${d}" stroke-width="${w}" stroke-dasharray="${i%2?'12 21':'20 13'}" opacity="${i%2?'.68':'.94'}"/>`).join('')}</g>`;}
function soundMarkup(s){const strength=s.water/100, tr=s.traffic/100, vo=s.voices/100;return `<g><ellipse cx="940" cy="310" rx="${100+s.water*2.3}" ry="${80+s.water*2.1}" fill="#6eafd2" opacity="${.07+strength*.22}" class="pulse"/>${[1,2,3,4].map((n)=>`<ellipse cx="940" cy="310" rx="${55+n*(45+strength*22)}" ry="${45+n*(42+strength*20)}" stroke="#348ab6" stroke-width="${3+strength*5}" opacity="${(.18+strength*.26)/n**.35}" fill="none"/>`).join('')}<path d="M5 510Q140 460 260 506T540 506" stroke="#d75b51" stroke-width="${6+tr*23}" opacity="${.15+tr*.77}" stroke-dasharray="17 12" fill="none"/><path d="M5 400Q105 365 230 402T500 410" stroke="#d75b51" stroke-width="${5+tr*14}" opacity="${.12+tr*.55}" fill="none" stroke-dasharray="12 15"/>${[0,1,2,3,4].slice(0,Math.round(vo*5)).map((n)=>`<circle cx="${360+n*118}" cy="${180+(n%3)*105}" r="${24+vo*38}" fill="none" stroke="#b27d89" stroke-width="${2+vo*5}" stroke-dasharray="3 8" opacity=".63"/>`).join('')}</g>`;}
function smellMarkup(s){return `<g class="drift">${[[375,235,180,80],[540,385,210,89],[795,380,145,105]].map(([x,y,rx,ry])=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#8ead68" opacity="${.08+s.scent/380}"/>`).join('')}<ellipse cx="${time===1?340:time===2?110:700}" cy="${time===1?470:470}" rx="${time===1?270:95}" ry="${time===1?75:40}" fill="#b99f72" opacity="${.05+s.scent/250}"/><path d="M190 260Q380 90 585 240" fill="none" stroke="#729658" stroke-width="${2+s.scent/11}" stroke-dasharray="2 19" opacity=".65"/></g>`;}
function scenarioLayer(id){const s=SCENARIOS[time];if(id==='social')return dotsMarkup(s);if(id==='movement')return routesMarkup(s);if(id==='sound')return soundMarkup(s);if(id==='smell')return smellMarkup(s);return svgShapes[id];}
function overlap(){let a=active; if(a.includes('sound')&&a.includes('movement'))return 'Sound + movement: does the waterfall mark a point where visitors change pace or pause?';if(a.includes('sound')&&a.includes('social'))return 'Sound + social life: a loud waterfall might support privacy by masking nearby conversation.';if(a.includes('smell')&&a.includes('movement'))return 'Smell + movement: does the sensation of leaving the street begin before or after crossing the entrance?';if(a.includes('hidden')&&a.includes('sound'))return 'Hidden systems + sound: tranquility depends on a maintained mechanical water feature.';if(a.includes('movement')&&a.includes('social'))return 'Movement + social life: recurring routes may lead to recurring gathering places.';if(a.length===0)return 'A blank plan records location, but almost nothing about how a place feels.';if(a.length===1)return insights[a[0]];return 'Change the order and visibility of layers to explore how different factors might coexist.';}
function render(){const root=document.getElementById('root');root.innerHTML=`<div class="app"><header class="top"><div><div class="eyebrow">Field Study 001 • An interactive counter-map</div><h1>The Illusion of Escape</h1></div><div class="subtitle">Greenacre Park / New York City<br>Prototype · illustrative observations</div></header><aside class="panel"><div class="tiny">01 / The archive</div><h2>Layers of atmosphere</h2><p class="muted">A park is more than its plan. Toggle layers, drag them to change which system sits on top, and see what changes.</p><div class="layers" id="layers">${order.map((id,i)=>{let d=DATA[id];return `<div class="layer ${active.includes(id)?'':'inactive'}" draggable="true" data-id="${id}" tabindex="0" aria-label="${d.name}, drag to reorder"><div class="swatch" style="background:${d.color}">${d.symbol}</div><div><strong>${d.name}</strong><small>${d.sub}</small></div><button aria-label="${active.includes(id)?'Hide':'Show'} ${d.name}" aria-pressed="${active.includes(id)}" data-toggle="${id}">${active.includes(id)?'✓':'+'}</button></div>`}).join('')}</div><div class="hint">↕ Drag cards to change stacking order.<br>✓ Toggle a card to reveal or hide it.<br>Click a layer name for its field-note prompt.</div><hr class="rule"><div class="tiny">Selected field note</div><div class="sidecard"><h3 id="selectedTitle">${DATA[selected].name}</h3><p id="selectedInfo">${DATA[selected].description}</p></div></aside><main class="mapzone"><div class="maphead"><div><div class="tiny">02 / Sensory cartography</div><h2>A park, beyond its boundaries</h2></div><div class="seg" role="group" aria-label="Time of day">${STATES.map((s,i)=>`<button data-time="${i}" aria-pressed="${time===i}">${s.name}</button>`).join('')}</div></div><div class="mapframe"><div class="mapcanvas" aria-label="Illustrative atmospheric overlays on Greenacre Park site plan"><img src="site-plan.jpg" alt="Black and white architectural plan of Greenacre Park"><svg viewBox="0 0 1200 567" preserveAspectRatio="none">${order.filter(id=>active.includes(id)).map(id=>`<g data-layer="${id}">${scenarioLayer(id)}</g>`).join('')}</svg></div></div><div class="mapfoot"><span>Base: provided official Greenacre Park plan / colored overlays: speculative sketches</span><span>${active.length} layers visible</span></div><div class="legend">${order.filter(id=>active.includes(id)).map(id=>`<span><i class="dot" style="background:${DATA[id].color}"></i>${DATA[id].name}</span>`).join('')}</div></main><aside class="panel right"><div class="tiny">03 / Interpretation</div><h2>Read the atmosphere</h2><p class="muted">These are questions generated by combinations of visible layers, not confirmed causal findings.</p><div class="sidecard"><div class="tiny">What might be happening?</div><h3 class="bigstatement">${overlap()}</h3></div><div class="sidecard"><div class="tiny">Illustrative activity snapshot</div><div class="metric"><span>Visitors shown</span><b>${SCENARIOS[time].visitors}</b></div><div class="metric"><span>Social clusters</span><b>${SCENARIOS[time].groups}</b></div><div class="metric"><span>Movement routes</span><b>${SCENARIOS[time].routes}</b></div><div class="metric"><span>Traffic presence</span><b>${SCENARIOS[time].traffic}%</b></div><div class="metric"><span>Conversation presence</span><b>${SCENARIOS[time].voices}%</b></div><p style="margin-top:10px">Main seating: ${SCENARIOS[time].focus}</p></div><div class="sidecard"><div class="tiny">Time state</div><h3>${STATES[time].name}</h3><p>${STATES[time].description}</p></div><hr class="rule"><div class="tiny">Try these experiments</div><div class="sidecard"><p><b>01</b> Hide every layer except Sound.<br><br><b>02</b> Add Social life. How might the meaning of noise change?<br><br><b>03</b> Move Hidden systems above Sound. What becomes newly visible?<br><br><b>04</b> Switch between Morning, Afternoon and Evening; track how the visitor dots and routes relocate.</p></div><div class="sidecard"><div class="tiny">Prototype status</div><p>Sound, smell, movement and social patterns are placeholders awaiting site measurements. Each time setting now shows a distinct speculative scenario: visitor count, seating distribution, paths, traffic, conversation, and scent all change. These are not field measurements.</p></div></aside><footer class="bottom"><div class="timeline"><div class="tiny">Time</div><span id="clock">${STATES[time].short}</span><input type="range" min="0" max="2" step="1" value="${time}" id="timeslider" aria-label="Select time of day"><span class="tag">${STATES[time].name}</span></div><button id="reset">Reset layers ↺</button></footer></div>`;
root.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=e=>{e.stopPropagation();let id=b.dataset.toggle;active=active.includes(id)?active.filter(x=>x!==id):[...active,id];render()});root.querySelectorAll('.layer').forEach(card=>{card.onclick=e=>{if(e.target.closest('button'))return;selected=card.dataset.id;document.getElementById('selectedTitle').textContent=DATA[selected].name;document.getElementById('selectedInfo').textContent=DATA[selected].description};card.ondragstart=e=>{e.dataTransfer.setData('text/plain',card.dataset.id);card.classList.add('dragging')};card.ondragend=()=>card.classList.remove('dragging');card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();let from=e.dataTransfer.getData('text/plain'),to=card.dataset.id;if(from&&to&&from!==to){order=order.filter(x=>x!==from);order.splice(order.indexOf(to),0,from);render()}};card.onkeydown=e=>{if(e.key==='Enter'){selected=card.dataset.id;render()}if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();let p=order.indexOf(card.dataset.id),n=Math.max(0,Math.min(order.length-1,p+(e.key==='ArrowUp'?-1:1)));[order[p],order[n]]=[order[n],order[p]];render();root.querySelector(`[data-id="${card.dataset.id}"]`).focus()}}});root.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{time=+b.dataset.time;render()});root.querySelector('#timeslider').oninput=e=>{time=+e.target.value;render()};root.querySelector('#reset').onclick=()=>{active=Object.keys(DATA);order=Object.keys(DATA);time=0;selected='sound';render()}}
render();
</script></body></html>
